<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111827">

  <!-- Optimizaciones para móvil -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <title>VeterinaryPoint</title>
  <base href="/" />

  <!-- Icons and PWA -->
  <link rel="icon" type="image/png" href="icons/icon-192x192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Estilos críticos inline para evitar flash -->
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background-color: #111827 !important;
      color: white !important;
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }

    body {
      background-color: #111827 !important;
      color: white !important;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* Preloader para móviles */
    #mobile-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #374151;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-gray-900 text-white">
  <!-- Loader para móviles -->
  <div id="mobile-loader">
    <div class="spinner"></div>
  </div>

  <app-root></app-root>

  <script>
    // Función simplificada para ocultar loader
    function hideLoader() {
      const loader = document.getElementById('mobile-loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 300);
      }
    }

    // Ocultar loader cuando Angular esté listo (timeout corto)
    setTimeout(hideLoader, 1500);
    
    // Timeout de seguridad más corto
    window.addEventListener('load', function() {
      setTimeout(hideLoader, 500);
    });
  </script>
</body>
</html>
